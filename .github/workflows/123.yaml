name: 准确诊断API源头问题
on: [workflow_dispatch]

jobs:
  accurate-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      
    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 安装依赖
      run: npm install axios crypto-js

    - name: 准确诊断API返回数据
      run: |
        cat > accurate_diagnose.js << 'EOF'
        const axios = require('axios');
        const CryptoJS = require('crypto-js');
        
        async function accurateDiagnose() {
          console.log('=== 准确诊断API返回数据 ===\n');
          
          try {
            // 直接获取央视分类的频道数据
            console.log('1. 获取央视分类频道列表...');
            const response = await axios.get(
              'http://sj.91kds.cn/api/get_channel.php?id=央视',
              { 
                timeout: 10000,
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                  'Referer': 'http://www.91kds.cn/'
                }
              }
            );
            
            console.log(`频道API响应状态: ${response.status}`);
            
            if (!response.data || !Array.isArray(response.data)) {
              console.log('❌ 频道API返回数据格式错误');
              return;
            }
            
            console.log(`找到 ${response.data.length} 个央视频道`);
            
            // 取前3个频道进行测试
            for (const channel of response.data.slice(0, 3)) {
              await testChannelSources(channel);
            }
            
          } catch (error) {
            console.log(`❌ API请求失败: ${error.message}`);
          }
        }
        
        async function testChannelSources(channel) {
          console.log(`\n--- 测试频道: ${channel.name} (${channel.ename}) ---`);
          
          const nwtime = Math.floor(Date.now() / 1000);
          const sign = CryptoJS.MD5(`${channel.ename}com.jiaoxiang.fangnaleahkajfkahlajjaflfakhfakfbuyaozaigaolefuquqikangbuzhu2.3.4fu:ck:92:92:ff${nwtime}20240918`).toString();
          
          try {
            const sourceRes = await axios.get(
              `http://sjapi1.91kds.cn/api/get_source.php?ename=${channel.ename}&app=com.jiaoxiang.fangnale&version=2.3.4&mac=fu:ck:92:92:ff&nwtime=${nwtime}&sign=${sign}&ev=20240918`,
              { 
                timeout: 10000,
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                  'Referer': 'http://www.91kds.cn/'
                }
              }
            );
            
            console.log(`源API响应状态: ${sourceRes.status}`);
            
            if (sourceRes.data?.liveSource && Array.isArray(sourceRes.data.liveSource)) {
              console.log(`频道 ${channel.name} 有 ${sourceRes.data.liveSource.length} 个播放源:`);
              
              sourceRes.data.liveSource.forEach((url, index) => {
                console.log(`\n--- 源 ${index + 1} ---`);
                console.log(`完整URL: ${url}`);
                console.log(`URL长度: ${url.length} 字符`);
                
                // 分析URL类型
                if (url.includes('kdsvod://')) {
                  console.log('协议类型: kdsvod://');
                  console.log('处理后URL:', url.replace('kdsvod://', ''));
                } else if (url.includes('http://') || url.includes('https://')) {
                  console.log('协议类型: HTTP/HTTPS');
                } else {
                  console.log('协议类型: 其他');
                }
                
                // 检查关键参数
                console.log(`包含id参数: ${url.includes('id=') ? '✅' : '❌'}`);
                console.log(`包含pwd参数: ${url.includes('pwd=') ? '✅' : '❌'}`);
                console.log(`包含#isVideo=true: ${url.includes('#isVideo=true') ? '✅' : '❌'}`);
                console.log(`包含app参数: ${url.includes('app=') ? '✅' : '❌'}`);
                
                // 检查域名
                console.log(`包含utuxx.91kds.cn: ${url.includes('utuxx.91kds.cn') ? '✅' : '❌'}`);
                console.log(`包含shyd.695847.xyz: ${url.includes('shyd.695847.xyz') ? '✅' : '❌'}`);
              });
            }
            
          } catch (error) {
            console.log(`❌ 源API请求失败: ${error.message}`);
          }
        }
        
        accurateDiagnose().catch(console.error);
        EOF
        
        echo "开始准确诊断API返回数据..."
        node accurate_diagnose.js

    - name: 验证处理函数
      run: |
        cat > verify_processing.js << 'EOF'
        // 使用真实的API数据测试处理函数
        const axios = require('axios');
        const CryptoJS = require('crypto-js');
        
        async function testWithRealData() {
          console.log('=== 使用真实数据测试处理函数 ===\n');
          
          try {
            // 获取真实数据
            const response = await axios.get(
              'http://sj.91kds.cn/api/get_channel.php?id=央视',
              { timeout: 10000 }
            );
            
            if (!response.data || !Array.isArray(response.data)) return;
            
            // 取第一个频道
            const channel = response.data[0];
            const nwtime = Math.floor(Date.now() / 1000);
            const sign = CryptoJS.MD5(`${channel.ename}com.jiaoxiang.fangnaleahkajfkahlajjaflfakhfakfbuyaozaigaolefuquqikangbuzhu2.3.4fu:ck:92:92:ff${nwtime}20240918`).toString();
            
            const sourceRes = await axios.get(
              `http://sjapi1.91kds.cn/api/get_source.php?ename=${channel.ename}&app=com.jiaoxiang.fangnale&version=2.3.4&mac=fu:ck:92:92:ff&nwtime=${nwtime}&sign=${sign}&ev=20240918`,
              { timeout: 10000 }
            );
            
            if (sourceRes.data?.liveSource) {
              console.log('原始API返回的URL:');
              sourceRes.data.liveSource.forEach((url, index) => {
                console.log(`\n${index + 1}. ${url}`);
                
                // 测试处理函数
                function processSpecialUrls(url) {
                  if (url.startsWith('kdsvod://')) {
                    return url.replace('kdsvod://', '');
                  }
                  return url;
                }
                
                const processed = processSpecialUrls(url);
                console.log(`处理后: ${processed}`);
                console.log(`参数是否完整: ${url.length === processed.length ? '✅' : '❌'}`);
              });
            }
            
          } catch (error) {
            console.log('测试失败:', error.message);
          }
        }
        
        testWithRealData();
        EOF
        
        echo "验证处理函数..."
        node verify_processing.js
