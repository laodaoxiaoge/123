name: 完整参数诊断
on: [workflow_dispatch]

jobs:
  full-param-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      
    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 安装依赖
      run: npm install axios crypto-js

    - name: 完整参数诊断
      run: |
        cat > full_param_diagnose.js << 'EOF'
        const axios = require('axios');
        const CryptoJS = require('crypto-js');
        
        async function fullParamDiagnose() {
          console.log('=== 完整参数诊断（不隐藏任何参数） ===\n');
          
          try {
            // 获取央视分类的频道数据
            const response = await axios.get(
              'http://sj.91kds.cn/api/get_channel.php?id=央视',
              { 
                timeout: 10000,
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                  'Referer': 'http://www.91kds.cn/'
                }
              }
            );
            
            if (!response.data || !Array.isArray(response.data)) {
              console.log('❌ 频道API返回数据格式错误');
              return;
            }
            
            console.log(`找到 ${response.data.length} 个央视频道`);
            
            // 取前3个频道进行测试
            for (const channel of response.data.slice(0, 3)) {
              await testChannelWithFullParams(channel);
            }
            
          } catch (error) {
            console.log(`❌ API请求失败: ${error.message}`);
          }
        }
        
        async function testChannelWithFullParams(channel) {
          console.log(`\n--- 测试频道: ${channel.name} (${channel.ename}) ---`);
          
          const nwtime = Math.floor(Date.now() / 1000);
          const sign = CryptoJS.MD5(`${channel.ename}com.jiaoxiang.fangnaleahkajfkahlajjaflfakhfakfbuyaozaigaolefuqu极ikangbuzhu2.3.4fu:ck:92:92:ff${nwtime}20240918`).toString();
          
          try {
            const sourceRes = await axios.get(
              `http://sjapi1.91kds.cn/api/get_source.php?ename=${channel.ename}&app=com.jiaoxiang.fangnale&version=2.3.4&mac=fu:ck:92:92:ff&nwtime=${nwtime}&sign=${sign}&ev=20240918`,
              { 
                timeout: 10000,
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                  'Referer': 'http://www.91kds.cn/'
                }
              }
            );
            
            if (sourceRes.data?.liveSource && Array.isArray(sourceRes.data.liveSource)) {
              console.log(`频道 ${channel.name} 有 ${sourceRes.data.liveSource.length} 个播放源:`);
              
              sourceRes.data.liveSource.forEach((url, index) => {
                console.log(`\n--- 源 ${index + 1} ---`);
                
                // 关键修改：不隐藏任何参数，显示完整URL
                console.log(`完整URL: ${url}`);
                console.log(`URL长度: ${url.length} 字符`);
                
                // 处理函数
                function processSpecialUrls(url) {
                  if (url.startsWith('kdsvod://')) {
                    return url.replace('kdsvod://', '');
                  }
                  return url;
                }
                
                const processedUrl = processSpecialUrls(url);
                console.log(`处理后URL: ${processedUrl}`);
                
                // 检查参数完整性（基于实际参数，而不是隐藏的***）
                const hasId = url.includes('id=');
                const hasPwd = url.includes('pwd=');
                const hasIsVideo = url.includes('#isVideo=true');
                const hasApp = url.includes('app=');
                
                console.log(`包含id参数: ${hasId ? '✅' : '❌'}`);
                console.log(`包含pwd参数: ${hasPwd ? '✅' : '❌'}`);
                console.log(`包含#isVideo=true: ${hasIsVideo ? '✅' : '❌'}`);
                console.log(`包含app参数: ${hasApp ? '✅' : '❌'}`);
                
                // 判断参数是否完整
                let isComplete = true;
                if (url.includes('utuxx.91kds.cn')) {
                  // 对于utuxx.91kds.cn的URL，我们希望有id和pwd参数
                  if (!hasId || !hasPwd) {
                    isComplete = false;
                  }
                }
                
                console.log(`参数是否完整: ${isComplete ? '✅' : '❌'}`);
              });
            }
            
          } catch (error) {
            console.log(`❌ 源API请求失败: ${error.message}`);
          }
        }
        
        fullParamDiagnose().catch(console.error);
        EOF
        
        echo "开始完整参数诊断（不隐藏任何参数）..."
        node full_param_diagnose.js
