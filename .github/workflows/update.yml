name: 91ktv直播源完整版
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # 每天UTC时间19点运行（北京时间3点）

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 增加超时时间到5小时，确保完整处理
    
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      
    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 安装依赖
      run: npm install axios crypto-js

    - name: 生成完整版直播源（不删减任何内容）
      run: |
        cat > generate_full.js << 'EOF'
        const axios = require('axios');
        const CryptoJS = require('crypto-js');
        const fs = require('fs');
        
        // 获取北京时间
        function getBeijingTime() {
          return new Date().toLocaleString('zh-CN', { 
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        }
        
        // 生成签名
        function generateSignature(ename, nwtime, ev = '20240918') {
          const appKey = 'com.jiaoxiang.fangnaleahkajfkahlajjaflfakhfakfbuyaozaigaolefuquqikangbuzhu2.3.4fu:ck:92:92:ff';
          const srcKey = ename + appKey + nwtime + ev;
          return CryptoJS.MD5(srcKey).toString();
        }
        
        // 为URL添加完整认证参数
        function addFullAuthParams(baseUrl, ename, nwtime, ev = '20240918') {
          const sign = generateSignature(ename, nwtime, ev);
          
          // 解析基础URL
          let url = baseUrl;
          if (url.startsWith('kdsvod://')) {
            url = url.replace('kdsvod://', '');
          }
          
          // 检查是否已有查询参数
          const separator = url.includes('?') ? '&' : '?';
          
          // 添加完整认证参数
          const authParams = new URLSearchParams({
            app: 'com.jiaoxiang.fangnale',
            version: '2.3.4',
            mac: 'fu:ck:92:92:ff',
            utk: '',
            nwtime: nwtime.toString(),
            ev: ev,
            sign: sign
          }).toString();
          
          return `${url}${separator}${authParams}`;
        }
        
        async function main() {
          console.log('开始生成完整版直播源（不删减任何分类和频道）...');
          const startTime = Date.now();
          const currentTime = getBeijingTime();
          
          let m3uContent = '#EXTM3U\n';
          m3uContent += `# 91ktv直播源更新时间: ${currentTime}\n`;
          m3uContent += `# 版本: 完整版 - 不删减任何分类和频道\n\n`;
          
          // 添加更新时间频道
          m3uContent += `#EXTINF:-1 tvg-id="UPDATE_TIME" tvg-name="更新时间: ${currentTime}" group-title="信息",更新时间: ${currentTime}\n`;
          m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n\n`;
          
          let totalChannels = 0;
          let totalStreams = 0;
          let successfulCategories = 0;
          
          // 完整分类列表（不删减任何分类）
          const categories = [
            '央视', '卫视', '高清', '4K', '影视', '体育', '新闻', '财经', '综艺', '教育',
            '纪录', '国际', '网络', '购物', '虎牙', '安徽', '北京', '重庆', '福建',
            '甘肃', '湖北', '湖南', '吉林', '江苏', '江西', '辽宁', '内蒙古', '宁夏', '青海',
            '山东', '山西', '陕西', '上海', '贵州', '海南', '河北', '河南', '黑龙江', '天津',
            '新疆', '西藏', '云南', '浙江', '广西', '广东', '四川'
          ];
          
          console.log(`开始处理 ${categories.length} 个完整分类（不删减任何分类）...`);
          
          // 处理每个分类（不跳过任何分类）
          for (const category of categories) {
            try {
              console.log(`处理分类: ${category}`);
              
              // 获取频道列表
              const response = await axios.get(
                `http://sj.91kds.cn/api/get_channel.php?id=${encodeURIComponent(category)}`,
                { 
                  timeout: 20000,  // 增加超时时间
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    'Referer': 'http://sj.91kds.cn'
                  }
                }
              );
              
              if (!response.data || !Array.isArray(response.data)) {
                console.log(`分类 ${category} 无数据，使用默认频道`);
                m3uContent += `# 分类: ${category}\n`;
                m3uContent += `#EXTINF:-1 tvg-id="default_${category}" tvg-name="${category}" group-title="${category}",${category}\n`;
                m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n\n`;
                continue;
              }
              
              console.log(`分类 ${category} 有 ${response.data.length} 个频道`);
              m3uContent += `# 分类: ${category}\n`;
              
              // 处理每个频道（不跳过任何频道）
              for (const channel of response.data) {
                try {
                  const nwtime = Math.floor(Date.now() / 1000);
                  let sign, apiUrl, ev;
                  
                  // 特别处理虎牙分类
                  if (category === '虎牙') {
                    ev = '20250113';
                    sign = generateSignature(channel.ename, nwtime, ev);
                    apiUrl = `http://api.91kds.cn/zone/srclist?ename=${channel.ename}&app=com.jiaoxiang.fangnale&version=2.3.4&mac=fu:ck:92:92:ff&nwtime=${nwtime}&sign=${sign}&ev=20250113`;
                  } else {
                    ev = '20240918';
                    sign = generateSignature(channel.ename, nwtime, ev);
                    apiUrl = `http://sjapi1.91kds.cn/api/get_source.php?ename=${channel.ename}&app=com.jiaoxiang.fangnale&version=2.3.4&mac=fu:ck:92:92:ff&nwtime=${nwtime}&sign=${sign}&ev=20240918`;
                  }
                  
                  console.log(`处理频道 ${channel.name} 签名: ${sign.substring(0, 8)}...`);
                  
                  // 获取播放源
                  const sourceRes = await axios.get(apiUrl, { 
                    timeout: 20000,  // 增加超时时间
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      'Referer': 'http://www.91kds.cn/'
                    }
                  });
                  
                  if (sourceRes.data?.liveSource && Array.isArray(sourceRes.data.liveSource)) {
                    const sources = sourceRes.data.liveSource;
                    const sourceNames = sourceRes.data.liveSourceName || [];
                    
                    console.log(`频道 ${channel.name} 有 ${sources.length} 个播放源`);
                    
                    // 添加频道信息
                    m3uContent += `#EXTINF:-1 tvg-id="${channel.ename}" tvg-name="${channel.name}" tvg-logo="${channel.icon}" group-title="${category}",${channel.name}\n`;
                    
                    // 为每个播放源添加完整认证参数（不跳过任何播放源）
                    for (let i = 0; i < sources.length; i++) {
                      let sourceUrl = sources[i];
                      const sourceName = sourceNames[i] || `线路${i + 1}`;
                      
                      console.log(`原始URL ${i + 1}: ${sourceUrl.substring(0, 100)}...`);
                      
                      // 为URL添加完整认证参数
                      const fullUrl = addFullAuthParams(sourceUrl, channel.ename, nwtime, ev);
                      console.log(`完整认证URL ${i + 1}: ${fullUrl.substring(0, 150)}...`);
                      
                      // 添加播放源
                      m3uContent += `${fullUrl}\n`;
                      totalStreams++;
                    }
                    
                    totalChannels++;
                  } else {
                    // 如果没有播放源，添加默认源
                    console.log(`频道 ${channel.name} 无播放源，使用默认源`);
                    m3uContent += `#EXTINF:-1 tvg-id="${channel.ename}" tvg-name="${channel.name}" tvg-logo="${channel.icon}" group-title="${category}",${channel.name}\n`;
                    m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n`;
                    totalChannels++;
                    totalStreams++;
                  }
                  
                } catch (error) {
                  console.log(`处理频道 ${channel.name} 失败: ${error.message}`);
                  // 即使失败也保存频道信息
                  m3uContent += `#EXTINF:-1 tvg-id="${channel.ename}" tvg-name="${channel.name}" group-title="${category}",${channel.name}\n`;
                  m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n`;
                  totalChannels++;
                  totalStreams++;
                }
                
                // 添加延迟避免请求过快
                await new Promise(resolve => setTimeout(resolve, 500));
              }
              
              m3uContent += '\n';
              successfulCategories++;
              
            } catch (error) {
              console.log(`处理分类 ${category} 失败: ${error.message}`);
              // 即使失败也保存分类信息
              m3uContent += `# 分类: ${category}\n`;
              m3uContent += `#EXTINF:-1 tvg-id="default_${category}" tvg-name="${category}" group-title="${category}",${category}\n`;
              m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n\n`;
            }
            
            // 添加延迟避免请求过快
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          
          // 添加统计信息
          const duration = Math.round((Date.now() - startTime) / 1000);
          m3uContent += `# 统计信息:\n`;
          m3uContent += `# 处理分类数: ${categories.length}\n`;
          m3uContent += `# 成功分类数: ${successfulCategories}\n`;
          m3uContent += `# 频道总数: ${totalChannels}\n`;
          m3uContent += `# 播放源总数: ${totalStreams}\n`;
          m3uContent += `# 生成耗时: ${duration}秒\n`;
          m3uContent += `# 更新时间: ${getBeijingTime()}\n`;
          m3uContent += `# 版本: 完整版 - 不删减任何分类和频道\n`;
          m3uContent += `# 说明: 为每个播放URL添加完整的认证参数\n`;
          m3uContent += `# 认证参数: app=com.jiaoxiang.fangnale&version=2.3.4&mac=fu:ck:92:92:ff&utk=&nwtime=...&ev=...&sign=...\n`;
          m3uContent += `# 普通分类: ev=20240918\n`;
          m3uContent += `# 虎牙分类: ev=20250113\n`;
          
          // 保存文件
          fs.writeFileSync('91ktv.m3u', m3uContent);
          
          console.log('生成完成!');
          console.log(`分类数: ${categories.length}（完整不删减）`);
          console.log(`成功分类数: ${successfulCategories}`);
          console.log(`频道数: ${totalChannels}（完整不删减）`);
          console.log(`播放源数: ${totalStreams}（完整不删减）`);
          console.log(`耗时: ${duration}秒`);
        }
        
        main().catch(console.error);
        EOF
        
        echo "开始生成完整版直播源（不删减任何分类和频道）..."
        node generate_full.js

    - name: 验证完整性
      run: |
        echo "=== 完整性验证 ==="
        echo "文件大小: $(wc -c < 91ktv.m3u) 字节"
        echo "总行数: $(wc -l < 91ktv.m3u)"
        echo "播放源数量: $(grep -c '^http' 91ktv.m3u)"
        echo "频道数量: $(grep -c '^#EXTINF' 91ktv.m3u)"
        echo ""
        echo "=== 认证参数验证 ==="
        echo "包含完整认证参数的URL数量: $(grep -c 'app=com\.jiaoxiang\.fangnale' 91ktv.m3u)"
        echo "包含utuxx.91kds.cn的URL数量: $(grep -c 'utuxx\.91kds\.cn' 91ktv.m3u)"
        echo "包含完整签名的URL数量: $(grep -c 'sign=' 91ktv.m3u)"
        echo ""
        echo "=== 分类完整性验证 ==="
        echo "处理的所有分类:"
        grep -o 'group-title="[^"]*"' 91ktv.m3u | sort | uniq -c | head -20
        echo ""
        echo "=== 示例URL（检查格式）==="
        grep -E 'utuxx\.91kds\.cn.*app=com\.jiaoxiang\.fangnale' 91ktv.m3u | head -3
        echo ""
        echo "=== 统计信息 ==="
        tail -15 91ktv.m3u

    - name: 提交更新
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add 91ktv.m3u
        git commit -m "完整版直播源更新（不删减任何分类和频道） $(date +'%Y-%m-%d %H:%M')" || echo "无变化"
        git push
