name: 91ktv直播源完全修正版
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # 每天UTC时间19点运行（北京时间3点）

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      
    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 安装依赖
      run: npm install axios crypto-js

    - name: 生成完全修正版直播源
      run: |
        cat > generate_fixed.js << 'EOF'
        const axios = require('axios');
        const CryptoJS = require('crypto-js');
        const fs = require('fs');
        
        // 获取北京时间
        function getBeijingTime() {
          return new Date().toLocaleString('zh-CN', { 
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        }
        
        // 生成签名
        function generateSignature(ename, nwtime, ev = '20250113') {
          const appKey = 'com.jiaoxiang.fangnaleahkajfkahlajjaflfakhfakfbuyaozaigaolefuquqikangbuzhu2.3.4fu:ck:92:92:ff';
          const srcKey = ename + appKey + nwtime + ev;
          return CryptoJS.MD5(srcKey).toString();
        }
        
        // 从ename中提取ID
        function extractId(ename) {
          const match = ename.match(/\d+/);
          return match ? match[0] : '11342412';
        }
        
        // 检查URL是否已包含认证参数
        function hasAuthParams(url) {
          return url.includes('app=') && url.includes('sign=');
        }
        
        async function main() {
          console.log('开始生成完全修正版直播源...');
          const startTime = Date.now();
          const currentTime = getBeijingTime();
          
          let m3uContent = '#EXTM3U\n';
          m3uContent += '# 91ktv直播源更新时间: ' + currentTime + '\n';
          m3uContent += '# 版本: 完全修正版 - 所有分类使用ev=20250113\n\n';
          
          let totalChannels = 0;
          let totalStreams = 0;
          let streamsWithAuth = 0;
          let streamsWithoutAuth = 0;
          
          // 完整分类列表
          const categories = [
            '央视', '卫视', '高清', '4K', '影视', '体育', '新闻', '财经', '综艺', '教育',
            '纪录', '国际', '网络', '购物', '虎牙', '安徽', '北京', '重庆', '福建',
            '甘肃', '湖北', '湖南', '吉林', '江苏', '江西', '辽宁', '内蒙古', '宁夏', '青海',
            '山东', '山西', '陕西', '上海', '贵州', '海南', '河北', '河南', '黑龙江', '天津',
            '新疆', '西藏', '云南', '浙江', '广西', '广东', '四川'
          ];
          
          console.log('开始处理 ' + categories.length + ' 个分类...');
          
          // 处理每个分类
          for (const category of categories) {
            try {
              console.log('处理分类: ' + category);
              
              // 获取频道列表
              const response = await axios.get(
                'http://sj.91kds.cn/api/get_channel.php?id=' + encodeURIComponent(category),
                { 
                  timeout: 20000,
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    'Referer': 'http://www.91kds.cn/'
                  }
                }
              );
              
              if (!response.data || !Array.isArray(response.data)) {
                console.log('分类 ' + category + ' 无数据，跳过');
                continue;
              }
              
              console.log('分类 ' + category + ' 有 ' + response.data.length + ' 个频道');
              m3uContent += '# 分类: ' + category + '\n';
              
              // 处理每个频道
              for (const channel of response.data) {
                try {
                  const nwtime = Math.floor(Date.now() / 1000);
                  const ev = '20250113';
                  const sign = generateSignature(channel.ename, nwtime, ev);
                  const id = extractId(channel.ename);
                  
                  let apiUrl;
                  if (category === '虎牙') {
                    apiUrl = 'http://api.91kds.cn/zone/srclist?ename=' + channel.ename;
                  } else {
                    apiUrl = 'http://sjapi1.91kds.cn/api/get_source.php?ename=' + channel.ename;
                  }
                  
                  console.log('处理频道: ' + channel.name);
                  
                  const sourceRes = await axios.get(apiUrl, { 
                    timeout: 20000,
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      'Referer': 'http://www.91kds.cn/'
                    }
                  });
                  
                  if (sourceRes.data && sourceRes.data.liveSource && Array.isArray(sourceRes.data.liveSource)) {
                    const sources = sourceRes.data.liveSource;
                    
                    // 添加频道信息
                    m3uContent += '#EXTINF:-1 tvg-id="' + channel.ename + '" tvg-name="' + channel.name + '" group-title="' + category + '",' + channel.name + '\n';
                    
                    // 处理每个播放源
                    for (const sourceUrl of sources) {
                      if (hasAuthParams(sourceUrl)) {
                        // 如果API返回的URL已包含认证参数，直接使用
                        m3uContent += sourceUrl + '\n';
                        streamsWithAuth++;
                        console.log('使用已认证URL: ' + sourceUrl.substring(0, 100));
                      } else {
                        // 如果API返回的URL不包含认证参数，添加完整认证参数
                        const authParams = new URLSearchParams({
                          id: id,
                          app: 'com.jiaoxiang.fangnale',
                          version: '2.3.4',
                          mac: 'fu:ck:92:92:ff',
                          utk: '',
                          nwtime: nwtime.toString(),
                          ev: ev,
                          sign: sign
                        }).toString();
                        
                        const separator = sourceUrl.includes('?') ? '&' : '?';
                        const fullUrl = sourceUrl + separator + authParams;
                        m3uContent += fullUrl + '\n';
                        streamsWithoutAuth++;
                        console.log('添加认证参数: ' + fullUrl.substring(0, 150));
                      }
                      totalStreams++;
                    }
                    
                    totalChannels++;
                  }
                  
                  // 添加延迟避免请求过快
                  await new Promise(resolve => setTimeout(resolve, 500));
                } catch (error) {
                  console.log('跳过频道: ' + channel.name);
                }
              }
              
              m3uContent += '\n';
              
            } catch (error) {
              console.log('跳过分类: ' + category);
            }
            
            // 添加延迟避免请求过快
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          
          // 添加统计信息
          const duration = Math.round((Date.now() - startTime) / 1000);
          m3uContent += '# 统计信息:\n';
          m3uContent += '# 处理分类数: ' + categories.length + '\n';
          m3uContent += '# 频道总数: ' + totalChannels + '\n';
          m3uContent += '# 播放源总数: ' + totalStreams + '\n';
          m3uContent += '# 已有认证参数: ' + streamsWithAuth + '\n';
          m3uContent += '# 添加认证参数: ' + streamsWithoutAuth + '\n';
          m3uContent += '# 生成耗时: ' + duration + '秒\n';
          m3uContent += '# 更新时间: ' + getBeijingTime() + '\n';
          
          // 保存文件
          fs.writeFileSync('91ktv.m3u', m3uContent);
          
          console.log('生成完成!');
          console.log('分类数: ' + categories.length);
          console.log('频道数: ' + totalChannels);
          console.log('播放源数: ' + totalStreams);
          console.log('已有认证参数: ' + streamsWithAuth);
          console.log('添加认证参数: ' + streamsWithoutAuth);
          console.log('耗时: ' + duration + '秒');
        }
        
        main().catch(console.error);
        EOF
        
        echo "开始生成完全修正版直播源..."
        node generate_fixed.js

    - name: 语法检查
      run: |
        echo "=== 语法检查 ==="
        node -c generate_fixed.js && echo "✅ 语法检查通过" || echo "❌ 语法检查失败"

    - name: 验证结果
      run: |
        echo "=== 结果验证 ==="
        if [ -f 91ktv.m3u ]; then
          echo "文件大小: $(wc -c < 91ktv.m3u) 字节"
          echo "播放源数量: $(grep -c '^http' 91ktv.m3u)"
          echo ""
          echo "=== 认证参数验证 ==="
          echo "包含认证参数的URL: $(grep -c 'app=com.jiaoxiang.fangnale' 91ktv.m3u)"
          echo "使用ev=20250113的URL: $(grep -c 'ev=20250113' 91ktv.m3u)"
          echo "包含id参数的URL: $(grep -c 'id=[0-9]' 91ktv.m3u)"
          echo ""
          echo "=== 示例URL ==="
          grep -E 'utuxx\.91kds\.cn' 91ktv.m3u | head -2
        else
          echo "文件未生成"
        fi

    - name: 提交更新
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add 91ktv.m3u
        git commit -m "完全修正版直播源更新 $(date +'%Y-%m-%d %H:%M')" || echo "无变化"
        git push
