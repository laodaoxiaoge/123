name: 91ktv直播源完整版
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # 每天UTC时间19点运行（北京时间3点）

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 增加超时时间到5小时，确保完整处理
    
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      
    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 安装依赖
      run: npm install axios crypto-js

    - name: 生成完整版直播源（特别处理虎牙分类）
      run: |
        cat > generate_full.js << 'EOF'
        const axios = require('axios');
        const CryptoJS = require('crypto-js');
        const fs = require('fs');
        
        // 获取北京时间
        function getBeijingTime() {
          return new Date().toLocaleString('zh-CN', { 
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        }
        
        // 生成签名
        function generateSignature(ename, nwtime, ev = '20240918') {
          const appKey = 'com.jiaoxiang.fangnaleahkajfkahlajjaflfakhfakfbuyaozaigaolefuquqikangbuzhu2.3.4fu:ck:92:92:ff';
          const srcKey = ename + appKey + nwtime + ev;
          return CryptoJS.MD5(srcKey).toString();
        }
        
        // 从ename中提取ID
        function extractId(ename) {
          const match = ename.match(/\d+/);
          return match ? match[0] : '11342412';
        }
        
        // 特别处理虎牙分类URL格式
        function processHuyaUrl(ename, nwtime, ev = '20250113') {
          const id = extractId(ename);
          const sign = generateSignature(ename, nwtime, ev);
          
          // 构建虎牙专用URL格式
          const baseUrl = 'http://utuxx.91kds.cn/live1/huya.m3u8';
          const authParams = new URLSearchParams({
            id: id,
            app: 'com.jiaoxiang.fangnale',
            version: '2.3.4',
            mac: 'fu:ck:92:92:ff',
            utk: '',
            nwtime: nwtime.toString(),
            ev: ev,
            sign: sign
          }).toString();
          
          return `${baseUrl}?${authParams}`;
        }
        
        // 为其他URL添加认证参数
        function addAuthParams(baseUrl, ename, nwtime, ev = '20240918') {
          const sign = generateSignature(ename, nwtime, ev);
          const id = extractId(ename);
          
          // 检查是否已有查询参数
          const separator = baseUrl.includes('?') ? '&' : '?';
          
          // 添加认证参数
          const authParams = new URLSearchParams({
            id: id,
            app: 'com.jiaoxiang.fangnale',
            version: '2.3.4',
            mac: 'fu:ck:92:92:ff',
            utk: '',
            nwtime: nwtime.toString(),
            ev: ev,
            sign: sign
          }).toString();
          
          return `${baseUrl}${separator}${authParams}`;
        }
        
        async function main() {
          console.log('开始生成完整版直播源（特别处理虎牙分类）...');
          const startTime = Date.now();
          const currentTime = getBeijingTime();
          
          let m3uContent = '#EXTM3U\n';
          m3uContent += `# 91ktv直播源更新时间: ${currentTime}\n`;
          m3uContent += `# 版本: 完整版 - 特别处理虎牙分类URL格式\n\n`;
          
          // 添加更新时间频道
          m3uContent += `#EXTINF:-1 tvg-id="UPDATE_TIME" tvg-name="更新时间: ${currentTime}" group-title="信息",更新时间: ${currentTime}\n`;
          m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n\n`;
          
          let totalChannels = 0;
          let totalStreams = 0;
          let successfulCategories = 0;
          
          // 完整分类列表（不删减任何分类）
          const categories = [
            '央视', '卫视', '高清', '4K', '影视', '体育', '新闻', '财经', '综艺', '教育',
            '纪录', '国际', '网络', '购物', '虎牙', '安徽', '北京', '重庆', '福建',
            '甘肃', '湖北', '湖南', '吉林', '江苏', '江西', '辽宁', '内蒙古', '宁夏', '青海',
            '山东', '山西', '陕西', '上海', '贵州', '海南', '河北', '河南', '黑龙江', '天津',
            '新疆', '西藏', '云南', '浙江', '广西', '广东', '四川'
          ];
          
          console.log(`开始处理 ${categories.length} 个完整分类（特别处理虎牙分类）...`);
          
          // 处理每个分类（不跳过任何分类）
          for (const category of categories) {
            try {
              console.log(`处理分类: ${category}`);
              
              // 获取频道列表
              const response = await axios.get(
                `http://sj.91kds.cn/api/get_channel.php?id=${encodeURIComponent(category)}`,
                { 
                  timeout: 20000,
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    'Referer': 'http://www.91kds.cn/'
                  }
                }
              );
              
              if (!response.data || !Array.isArray(response.data)) {
                console.log(`分类 ${category} 无数据，使用默认频道`);
                m3uContent += `# 分类: ${category}\n`;
                m3uContent += `#EXTINF:-1 tvg-id="default_${category}" tvg-name="${category}" group-title="${category}",${category}\n`;
                m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n\n`;
                continue;
              }
              
              console.log(`分类 ${category} 有 ${response.data.length} 个频道`);
              m3uContent += `# 分类: ${category}\n`;
              
              // 处理每个频道（不跳过任何频道）
              for (const channel of response.data) {
                try {
                  const nwtime = Math.floor(Date.now() / 1000);
                  
                  console.log(`处理频道 ${channel.name}`);
                  
                  // 获取播放源
                  let apiUrl;
                  if (category === '虎牙') {
                    // 虎牙分类使用专用API
                    apiUrl = `http://api.91kds.cn/zone/srclist?ename=${channel.ename}`;
                  } else {
                    // 其他分类使用普通API
                    apiUrl = `http://sjapi1.91kds.cn/api/get_source.php?ename=${channel.ename}`;
                  }
                  
                  const sourceRes = await axios.get(apiUrl, { 
                    timeout: 20000,
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      'Referer': 'http://www.91kds.cn/'
                    }
                  });
                  
                  if (sourceRes.data?.liveSource && Array.isArray(sourceRes.data.liveSource)) {
                    const sources = sourceRes.data.liveSource;
                    
                    console.log(`频道 ${channel.name} 有 ${sources.length} 个播放源`);
                    
                    // 添加频道信息
                    m3uContent += `#EXTINF:-1 tvg-id="${channel.ename}" tvg-name="${channel.name}" tvg-logo="${channel.icon}" group-title="${category}",${channel.name}\n`;
                    
                    // 特别处理虎牙分类
                    if (category === '虎牙') {
                      // 为虎牙分类生成专用URL格式
                      const huyaUrl = processHuyaUrl(channel.ename, nwtime, '20250113');
                      console.log(`虎牙专用URL: ${huyaUrl.substring(0, 100)}...`);
                      m3uContent += `${huyaUrl}\n`;
                      totalStreams++;
                    } else {
                      // 处理其他分类的播放源
                      for (const sourceUrl of sources) {
                        let finalUrl = sourceUrl;
                        
                        // 处理kdsvod://协议
                        if (finalUrl.startsWith('kdsvod://')) {
                          finalUrl = finalUrl.replace('kdsvod://', 'http://');
                        }
                        
                        // 为URL添加认证参数
                        finalUrl = addAuthParams(finalUrl, channel.ename, nwtime, '20240918');
                        console.log(`处理后的URL: ${finalUrl.substring(0, 100)}...`);
                        
                        m3uContent += `${finalUrl}\n`;
                        totalStreams++;
                      }
                    }
                    
                    totalChannels++;
                  } else {
                    // 如果没有播放源，添加默认源
                    console.log(`频道 ${channel.name} 无播放源，使用默认源`);
                    m3uContent += `#EXTINF:-1 tvg-id="${channel.ename}" tvg-name="${channel.name}" tvg-logo="${channel.icon}" group-title="${category}",${channel.name}\n`;
                    
                    if (category === '虎牙') {
                      // 虎牙分类使用专用URL格式
                      const huyaUrl = processHuyaUrl(channel.ename, nwtime, '20250113');
                      m3uContent += `${huyaUrl}\n`;
                    } else {
                      m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n`;
                    }
                    
                    totalChannels++;
                    totalStreams++;
                  }
                  
                } catch (error) {
                  console.log(`处理频道 ${channel.name} 失败: ${error.message}`);
                  // 即使失败也保存频道信息
                  m3uContent += `#EXTINF:-1 tvg-id="${channel.ename}" tvg-name="${channel.name}" group-title="${category}",${channel.name}\n`;
                  
                  if (category === '虎牙') {
                    const nwtime = Math.floor(Date.now() / 1000);
                    const huyaUrl = processHuyaUrl(channel.ename, nwtime, '20250113');
                    m3uContent += `${huyaUrl}\n`;
                  } else {
                    m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n`;
                  }
                  
                  totalChannels++;
                  totalStreams++;
                }
                
                // 添加延迟避免请求过快
                await new Promise(resolve => setTimeout(resolve, 500));
              }
              
              m3uContent += '\n';
              successfulCategories++;
              
            } catch (error) {
              console.log(`处理分类 ${category} 失败: ${error.message}`);
              // 即使失败也保存分类信息
              m3uContent += `# 分类: ${category}\n`;
              m3uContent += `#EXTINF:-1 tvg-id="default_${category}" tvg-name="${category}" group-title="${category}",${category}\n`;
              
              if (category === '虎牙') {
                const nwtime = Math.floor(Date.now() / 1000);
                const huyaUrl = processHuyaUrl('default_huya', nwtime, '20250113');
                m3uContent += `${huyaUrl}\n`;
              } else {
                m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n`;
              }
              
              m3uContent += '\n';
            }
            
            // 添加延迟避免请求过快
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          
          // 添加统计信息
          const duration = Math.round((Date.now() - startTime) / 1000);
          m3uContent += `# 统计信息:\n`;
          m3uContent += `# 处理分类数: ${categories.length}\n`;
          m3uContent += `# 成功分类数: ${successfulCategories}\n`;
          m3uContent += `# 频道总数: ${totalChannels}\n`;
          m3uContent += `# 播放源总数: ${totalStreams}\n`;
          m3uContent += `# 生成耗时: ${duration}秒\n`;
          m3uContent += `# 更新时间: ${getBeijingTime()}\n`;
          m3uContent += `# 版本: 完整版 - 特别处理虎牙分类URL格式\n`;
          m3uContent += `# 虎牙URL格式: http://utuxx.91kds.cn/live1/huya.m3u8?id=...&app=com.jiaoxiang.fangnale&version=2.3.4&mac=fu%3Ack%3A92%3A92%3Aff&utk=&nwtime=...&ev=20250113&sign=...\n`;
          
          // 保存文件
          fs.writeFileSync('91ktv.m3u', m3uContent);
          
          console.log('生成完成!');
          console.log(`分类数: ${categories.length}`);
          console.log(`成功分类数: ${successfulCategories}`);
          console.log(`频道数: ${totalChannels}`);
          console.log(`播放源数: ${totalStreams}`);
          console.log(`耗时: ${duration}秒`);
        }
        
        main().catch(console.error);
        EOF
        
        echo "开始生成完整版直播源（特别处理虎牙分类URL格式）..."
        node generate_full.js

    - name: 验证虎牙分类URL格式
      run: |
        echo "=== 虎牙分类URL格式验证 ==="
        if [ -f 91ktv.m3u ]; then
          echo "文件大小: $(wc -c < 91ktv.m3u) 字节"
          echo "虎牙分类频道数: $(grep -c 'group-title=\"虎牙\"' 91ktv.m3u)"
          echo "虎牙分类播放源数: $(grep -A1 'group-title=\"虎牙\"' 91ktv.m3u | grep -c 'http://utuxx.91kds.cn/live1/huya.m3u8')"
          echo ""
          echo "=== 虎牙URL格式验证 ==="
          echo "正确的虎牙URL格式: $(grep -m1 'http://utuxx.91kds.cn/live1/huya.m3u8?' 91ktv.m3u | head -1)"
          echo ""
          echo "=== 参数验证 ==="
          echo "包含id参数的URL: $(grep -c 'id=' 91ktv.m3u)"
          echo "包含app参数的URL: $(grep -c 'app=com.jiaoxiang.fangnale' 91ktv.m3u)"
          echo "包含ev=20250113的URL: $(grep -c 'ev=20250113' 91ktv.m3u)"
          echo "包含sign参数的URL: $(grep -c 'sign=' 91ktv.m3u)"
          echo ""
          echo "=== 示例虎牙URL ==="
          grep -m1 'http://utuxx.91kds.cn/live1/huya.m3u8?' 91ktv.m3u
        else
          echo "文件未生成"
        fi

    - name: 提交更新
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add 91ktv.m3u
        git commit -m "虎牙分类URL格式特别处理更新 $(date +'%Y-%m-%d %H:%M')" || echo "无变化"
        git push
