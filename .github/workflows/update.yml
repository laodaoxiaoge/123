name: 91ktv直播源完整版
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # 每天UTC时间19点运行（北京时间3点）

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 增加超时时间到5小时，确保完整处理
    
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      
    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 安装依赖
      run: npm install axios crypto-js

    - name: 生成完整版直播源（多API巡查+完整URL类型）
      run: |
        cat > generate_full.js << 'EOF'
        const axios = require('axios');
        const CryptoJS = require('crypto-js');
        const fs = require('fs');
        
        // 获取北京时间
        function getBeijingTime() {
          return new Date().toLocaleString('zh-CN', { 
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        }
        
        // 生成签名
        function generateSignature(ename, nwtime, ev = '20240918') {
          const appKey = 'com.jiaoxiang.fangnaleahkajfkahlajjaflfakhfakfbuyaozaigaolefuquqikangbuzhu2.3.4fu:ck:92:92:ff';
          const srcKey = ename + appKey + nwtime + ev;
          return CryptoJS.MD5(srcKey).toString();
        }
        
        // 从ename中提取ID
        function extractId(ename) {
          const match = ename.match(/\d+/);
          return match ? match[0] : '11342412';
        }
        
        // 多API巡查获取频道列表
        async function getChannelListWithBackup(category) {
          const apiEndpoints = [
            `http://sj.91kds.cn/api/get_channel.php?id=${encodeURIComponent(category)}`,
            `http://sjapi1.91kds.cn/api/get_channel.php?id=${encodeURIComponent(category)}`,
            `http://sjapi2.91kds.cn/api/get_channel.php?id=${encodeURIComponent(category)}`,
            `http://api.91kds.cn/zone/channellist?id=${encodeURIComponent(category)}`
          ];
          
          const headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
            'Referer': 'http://www.91kds.cn/'
          };
          
          // 尝试所有API端点
          for (const apiUrl of apiEndpoints) {
            try {
              console.log(`尝试API: ${apiUrl}`);
              const response = await axios.get(apiUrl, { 
                timeout: 15000,
                headers: headers
              });
              
              if (response.data && Array.isArray(response.data)) {
                console.log(`API成功: ${apiUrl}, 获取到 ${response.data.length} 个频道`);
                return {
                  data: response.data,
                  source: apiUrl
                };
              }
            } catch (error) {
              console.log(`API失败: ${apiUrl}, 错误: ${error.message}`);
              continue;
            }
          }
          
          console.log(`所有API都失败，分类 ${category} 无数据`);
          return { data: [], source: 'none' };
        }
        
        // 多API巡查获取播放源
        async function getSourceListWithBackup(ename, category) {
          let apiEndpoints = [];
          
          if (category === '虎牙') {
            apiEndpoints = [
              `http://api.91kds.cn/zone/srclist?ename=${ename}`,
              `http://api2.91kds.cn/zone/srclist?ename=${ename}`,
              `http://sj.91kds.cn/api/get_source.php?ename=${ename}`,
              `http://sjapi1.91kds.cn/api/get_source.php?ename=${ename}`
            ];
          } else {
            apiEndpoints = [
              `http://sjapi1.91kds.cn/api/get_source.php?ename=${ename}`,
              `http://sjapi2.91kds.cn/api/get_source.php?ename=${ename}`,
              `http://sj.91kds.cn/api/get_source.php?ename=${ename}`,
              `http://api.91kds.cn/zone/srclist?ename=${ename}`
            ];
          }
          
          const headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
            'Referer': 'http://www.91kds.cn/'
          };
          
          // 尝试所有API端点
          for (const apiUrl of apiEndpoints) {
            try {
              console.log(`尝试源API: ${apiUrl}`);
              const response = await axios.get(apiUrl, { 
                timeout: 15000,
                headers: headers
              });
              
              if (response.data && response.data.liveSource && Array.isArray(response.data.liveSource)) {
                console.log(`源API成功: ${apiUrl}, 获取到 ${response.data.liveSource.length} 个播放源`);
                return {
                  data: response.data,
                  source: apiUrl
                };
              }
            } catch (error) {
              console.log(`源API失败: ${apiUrl}, 错误: ${error.message}`);
              continue;
            }
          }
          
          console.log(`所有源API都失败，频道 ${ename} 无播放源`);
          return { data: { liveSource: [] }, source: 'none' };
        }
        
        // 为URL添加完整认证参数
        function addFullAuthParams(baseUrl, ename, nwtime, ev = '20240918') {
          const sign = generateSignature(ename, nwtime, ev);
          const id = extractId(ename);
          
          // 检查是否已有查询参数
          const separator = baseUrl.includes('?') ? '&' : '?';
          
          // 添加完整认证参数
          const authParams = new URLSearchParams({
            id: id,
            app: 'com.jiaoxiang.fangnale',
            version: '2.3.4',
            mac: 'fu:ck:92:92:ff',
            utk: '',
            nwtime: nwtime.toString(),
            ev: ev,
            sign: sign
          }).toString();
          
          return `${baseUrl}${separator}${authParams}`;
        }
        
        // 处理URL类型，确保包含jsb.m3u8类型
        function processUrlType(sourceUrl, category, ename, nwtime, ev) {
          let finalUrl = sourceUrl;
          
          // 处理kdsvod://协议
          if (finalUrl.startsWith('kdsvod://')) {
            finalUrl = finalUrl.replace('kdsvod://', 'http://');
          }
          
          // 特别处理虎牙分类
          if (category === '虎牙') {
            if (!finalUrl.includes('utuxx.91kds.cn/live1/huya.m3u8')) {
              finalUrl = 'http://utuxx.91kds.cn/live1/huya.m3u8';
            }
          }
          // 确保其他分类包含jsb.m3u8类型
          else if (!finalUrl.includes('utuxx.91kds.cn/live1/') && category !== '虎牙') {
            // 如果不是utuxx域名，转换为jsb.m3u8类型
            finalUrl = 'http://utuxx.91kds.cn/live1/jsb.m3u8';
          }
          
          // 为所有utuxx域名URL添加认证参数
          if (finalUrl.includes('utuxx.91kds.cn')) {
            finalUrl = addFullAuthParams(finalUrl, ename, nwtime, ev);
          }
          
          return finalUrl;
        }
        
        async function main() {
          console.log('开始生成完整版直播源（多API巡查+完整URL类型）...');
          const startTime = Date.now();
          const currentTime = getBeijingTime();
          
          let m3uContent = '#EXTM3U\n';
          m3uContent += `# 91ktv直播源更新时间: ${currentTime}\n`;
          m3uContent += `# 版本: 多API巡查版 - 包含jsb.m3u8类型\n\n`;
          
          // 添加更新时间频道
          m3uContent += `#EXTINF:-1 tvg-id="UPDATE_TIME" tvg-name="更新时间: ${currentTime}" group-title="信息",更新时间: ${currentTime}\n`;
          m3uContent += `https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n\n`;
          
          let totalChannels = 0;
          let totalStreams = 0;
          let successfulCategories = 0;
          let apiUsageStats = {};
          let urlTypeStats = {
            'huya.m3u8': 0,
            'jsb.m3u8': 0,
            'other': 0
          };
          
          // 完整分类列表
          const categories = [
            '央视', '卫视', '高清', '4K', '影视', '体育', '新闻', '财经', '综艺', '教育',
            '纪录', '国际', '网络', '购物', '虎牙', '安徽', '北京', '重庆', '福建',
            '甘肃', '湖北', '湖南', '吉林', '江苏', '江西', '辽宁', '内蒙古', '宁夏', '青海',
            '山东', '山西', '陕西', '上海', '贵州', '海南', '河北', '河南', '黑龙江', '天津',
            '新疆', '西藏', '云南', '浙江', '广西', '广东', '四川'
          ];
          
          console.log(`开始处理 ${categories.length} 个分类（多API巡查）...`);
          
          // 处理每个分类
          for (const category of categories) {
            try {
              console.log(`处理分类: ${category}`);
              
              // 使用多API巡查获取频道列表
              const channelResult = await getChannelListWithBackup(category);
              const channels = channelResult.data;
              const apiSource = channelResult.source;
              
              // 统计API使用情况
              if (!apiUsageStats[apiSource]) {
                apiUsageStats[apiSource] = 0;
              }
              apiUsageStats[apiSource]++;
              
              if (!channels || channels.length === 0) {
                console.log(`分类 ${category} 无数据，使用默认频道`);
                m3uContent += `# 分类: ${category}\n`;
                m3uContent += `#EXTINF:-1 tvg-id="default_${category}" tvg-name="${category}" group-title="${category}",${category}\n`;
                
                // 根据分类类型使用不同的默认URL
                if (category === '虎牙') {
                  const nwtime = Math.floor(Date.now() / 1000);
                  const defaultUrl = addFullAuthParams('http://utuxx.91kds.cn/live1/huya.m3u8', `default_${category}`, nwtime, '20250113');
                  m3uContent += `${defaultUrl}\n`;
                  urlTypeStats['huya.m3u8']++;
                } else {
                  const nwtime = Math.floor(Date.now() / 1000);
                  const defaultUrl = addFullAuthParams('http://utuxx.91kds.cn/live1/jsb.m3u8', `default_${category}`, nwtime, '20240918');
                  m3uContent += `${defaultUrl}\n`;
                  urlTypeStats['jsb.m3u8']++;
                }
                
                m3uContent += `\n`;
                continue;
              }
              
              console.log(`分类 ${category} 有 ${channels.length} 个频道（API源: ${apiSource}）`);
              m3uContent += `# 分类: ${category} (API: ${apiSource})\n`;
              
              // 处理每个频道
              for (const channel of channels) {
                try {
                  const nwtime = Math.floor(Date.now() / 1000);
                  const ev = category === '虎牙' ? '20250113' : '20240918';
                  
                  console.log(`处理频道 ${channel.name}`);
                  
                  // 使用多API巡查获取播放源
                  const sourceResult = await getSourceListWithBackup(channel.ename, category);
                  const sources = sourceResult.data.liveSource || [];
                  const sourceApi = sourceResult.source;
                  
                  // 统计API使用情况
                  if (!apiUsageStats[sourceApi]) {
                    apiUsageStats[sourceApi] = 0;
                  }
                  apiUsageStats[sourceApi]++;
                  
                  if (sources.length === 0) {
                    console.log(`频道 ${channel.name} 无播放源，使用默认源`);
                    m3uContent += `#EXTINF:-1 tvg-id="${channel.ename}" tvg-name="${channel.name}" tvg-logo="${channel
