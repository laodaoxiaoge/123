name: 91ktv直播源最终修正版
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # 每天UTC时间19点运行（北京时间3点）

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      
    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 安装依赖
      run: npm install axios crypto-js

    - name: 生成最终修正版直播源
      run: |
        cat > generate_final.js << 'EOF'
        const axios = require('axios');
        const CryptoJS = require('crypto-js');
        const fs = require('fs');
        
        // Get Beijing Time
        function getBeijingTime() {
          return new Date().toLocaleString('zh-CN', {
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        }
        
        // Generate signature
        function generateSignature(ename, nwtime, ev = '20250113') {
          const appKey = 'com.jiaoxiang.fangnaleahkajfkahlajjaflfakhfakfbuyaozaigaolefuquqikangbuzhu2.3.4fu:ck:92:92:ff';
          const srcKey = ename + appKey + nwtime + ev;
          return CryptoJS.MD5(srcKey).toString();
        }
        
        // Extract ID from ename
        function extractId(ename) {
          const match = ename.match(/\d+/);
          return match ? match[0] : '11342412';
        }
        
        // Check if URL has auth params
        function hasAuthParams(url) {
          return url.includes('app=') && url.includes('sign=');
        }
        
        // Check if URL is utuxx domain
        function isUtuxxUrl(url) {
          return url.includes('utuxx.91kds.cn');
        }
        // 为URL添加完整认证参数
        function addFullAuthParams(baseUrl, ename, nwtime, ev = '20240918') {
          const sign = generateSignature(ename, nwtime, ev);
        // Process kdsvod protocol - remove header
        function processKdsvodUrl(url) {
          if (url.startsWith('kdsvod://')) {
            return url.replace('kdsvod://', '');
          }
          return url;
        }
        
        async function main() {
          console.log('Start generating final live source...');
          const startTime = Date.now();
          const currentTime = getBeijingTime();
          const ev = '20250113';
          
          let m3uContent = '#EXTM3U\n';
          m3uContent += '# 91ktv live source update time: ' + currentTime + '\n';
          m3uContent += '# Version: Final - Remove kdsvod:// header\n\n';
          
          let totalChannels = 0;
          let totalStreams = 0;
          let streamsWithAuth = 0;
          let streamsWithoutAuth = 0;
          let processedKdsvodUrls = 0;
          
          // All categories
          const categories = [
            '央视', '卫视', '高清', '4K', '影视', '体育', '新闻', '财经', '综艺', '教育',
            '纪录', '国际', '网络', '购物', '虎牙', '安徽', '北京', '重庆', '福建',
            '甘肃', '湖北', '湖南', '吉林', '江苏', '江西', '辽宁', '内蒙古', '宁夏', '青海',
            '山东', '山西', '陕西', '上海', '贵州', '海南', '河北', '河南', '黑龙江', '天津',
            '新疆', '西藏', '云南', '浙江', '广西', '广东', '四川'
          ];
          
          console.log('Start processing ' + categories.length + ' categories...');
          
          for (const category of categories) {
            try {
              console.log('Processing category: ' + category);
              
              // Get channel list
              const response = await axios.get(
                'http://sj.91kds.cn/api/get_channel.php?id=' + encodeURIComponent(category),
                { 
                  timeout: 20000,
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    'Referer': 'http://www.91kds.cn/'
                  }
                }
              );
              
              if (!response.data || !Array.isArray(response.data)) {
                console.log('Category ' + category + ' has no data, skip');
                continue;
              }
              
              console.log('Category ' + category + ' has ' + response.data.length + ' channels');
              m3uContent += '# Category: ' + category + '\n';
              
              for (const channel of response.data) {
                try {
                  const nwtime = Math.floor(Date.now() / 1000);
                  const sign = generateSignature(channel.ename, nwtime, ev);
                  const id = extractId(channel.ename);
                  
                  let apiUrl;
                  if (category === '虎牙') {
                    apiUrl = 'http://api.91kds.cn/zone/srclist?ename=' + channel.ename;
                  } else {
                    apiUrl = 'http://sjapi1.91kds.cn/api/get_source.php?ename=' + channel.ename;
                  }
                  
                  console.log('Processing channel: ' + channel.name + ', ev=' + ev);
                  
                  const sourceRes = await axios.get(apiUrl, { 
                    timeout: 20000,
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      'Referer': 'http://www.91kds.cn/'
                    }
                  });
                  
                  if (sourceRes.data && sourceRes.data.liveSource && Array.isArray(sourceRes.data.liveSource)) {
                    const sources = sourceRes.data.liveSource;
                    
                    // Add channel info
                    m3uContent += '#EXTINF:-1 tvg-id="' + channel.ename + '" tvg-name="' + channel.name + '" tvg-logo="' + (channel.icon || '') + '" group-title="' + category + '",' + channel.name + '\n';
                    
                    for (const sourceUrl of sources) {
                      // Process kdsvod protocol
                      let finalUrl = processKdsvodUrl(sourceUrl);
                      if (sourceUrl !== finalUrl) {
                        console.log('Process kdsvod URL: ' + sourceUrl + ' -> ' + finalUrl);
                        processedKdsvodUrls++;
                      }
                      
                      // For Huya category, ensure correct URL format
                      if (category === '虎牙' && !finalUrl.includes('utuxx.91kds.cn/live1/huya.m3u8')) {
                        finalUrl = 'http://utuxx.91kds.cn/live1/huya.m3u8?id=' + id;
                      }
                      
                      // Add auth params for all utuxx domain URLs
                      if (isUtuxxUrl(finalUrl) && !hasAuthParams(finalUrl)) {
                        const authParams = new URLSearchParams({
                          id: id,
                          app: 'com.jiaoxiang.fangnale',
                          version: '2.3.4',
                          mac: 'fu:ck:92:92:ff',
                          utk: '',
                          nwtime: nwtime.toString(),
                          ev: ev,
                          sign: sign
                        }).toString();
                        
                        const separator = finalUrl.includes('?') ? '&' : '?';
                        const fullUrl = finalUrl + separator + authParams;
                        m3uContent += fullUrl + '\n';
                        streamsWithoutAuth++;
                        console.log('Add auth params: ' + fullUrl.substring(0, 150));
                      } else {
                        m3uContent += finalUrl + '\n';
                        streamsWithAuth++;
                        console.log('Use URL: ' + finalUrl.substring(0, 100));
                      }
                      totalStreams++;
                    }
                    
                    totalChannels++;
                  }
                  
                  await new Promise(resolve => setTimeout(resolve, 500));
                } catch (error) {
                  console.log('Skip channel: ' + channel.name);
                }
              }
              
              m3uContent += '\n';
              await new Promise(resolve => setTimeout(resolve, 1000));
            } catch (error) {
              console.log('Skip category: ' + category);
            }
          }
          
          // Add statistics
          const duration = Math.round((Date.now() - startTime) / 1000);
          m3uContent += '# Statistics:\n';
          m3uContent += '# Categories processed: ' + categories.length + '\n';
          m3uContent += '# Total channels: ' + totalChannels + '\n';
          m3uContent += '# Total streams: ' + totalStreams + '\n';
          m3uContent += '# Streams with auth: ' + streamsWithAuth + '\n';
          m3uContent += '# Streams without auth: ' + streamsWithoutAuth + '\n';
          m3uContent += '# Processed kdsvod URLs: ' + processedKdsvodUrls + '\n';
          m3uContent += '# Generation time: ' + duration + 's\n';
          m3uContent += '# Update time: ' + currentTime + '\n';
          m3uContent += '# EV parameter: ' + ev + '\n';
          
          fs.writeFileSync('91ktv.m3u', m3uContent);
          
          console.log('Generation completed!');
          console.log('Categories: ' + categories.length);
          console.log('Channels: ' + totalChannels);
          console.log('Streams: ' + totalStreams);
          console.log('Streams with auth: ' + streamsWithAuth);
          console.log('Streams without auth: ' + streamsWithoutAuth);
          console.log('Processed kdsvod URLs: ' + processedKdsvodUrls);
          console.log('Time: ' + duration + 's');
        }
        
        main().catch(console.error);
        EOF
        
        echo "Start generating final live source..."
        node generate_final.js

    - name: Verify result
      run: |
        echo "=== Result Verification ==="
        if [ -f 91ktv.m3u ]; then
          echo "File size: $(wc -c < 91ktv.m3u) bytes"
          echo "Stream count: $(grep -c '^http' 91ktv.m3u)"
          echo ""
          echo "=== KDSVOD Protocol Verification ==="
          echo "KDSVOD protocol URLs: $(grep -c 'kdsvod://' 91ktv.m3u || echo 0)"
          echo "Processed URLs: $(grep -c 'http://' 91ktv.m3u)"
          echo ""
          echo "=== Auth Parameters Verification ==="
          echo "URLs with auth params: $(grep -c 'app=com.jiaoxiang.fangnale' 91ktv.m3u)"
          echo "URLs with ev=20250113: $(grep -c 'ev=20250113' 91ktv.m3u)"
          echo ""
          echo "=== Huya Category Verification ==="
          echo "Huya category channels: $(grep -c 'group-title=\"虎牙\"' 91ktv.m3u)"
          echo "Huya URL format: $(grep -A1 'group-title=\"虎牙\"' 91ktv.m3u | grep 'http://utuxx.91kds.cn/live1/huya.m3u8' | head -1 | cut -d'?' -f1)"
          echo ""
          echo "=== Example URL ==="
          grep -E 'http://utuxx.91kds.cn/live1/huya.m3u8.*id=[0-9]+.*app=com.jiaoxiang.fangnale.*ev=20250113.*sign=[a-f0-9]+' 91ktv.m3u | head -1
        else
          echo "File not generated"
        fi

    - name: Commit changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add 91ktv.m3u
        git commit -m "Final live source update $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
        git push
