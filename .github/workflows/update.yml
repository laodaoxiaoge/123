name: 91ktv直播源简洁版
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # 每天UTC时间19点运行（北京时间3点）

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      
    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 安装依赖
      run: npm install axios crypto-js

    - name: 生成简洁版直播源
      run: |
        cat > generate_clean.js << 'EOF'
        const axios = require('axios');
        const CryptoJS = require('crypto-js');
        const fs = require('fs');
        
        // 获取北京时间
        function getBeijingTime() {
          return new Date().toLocaleString('zh-CN', { 
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        }
        
        // 生成签名
        function generateSignature(ename, nwtime, ev = '20250113') {
          const appKey = 'com.jiaoxiang.fangnaleahkajfkahlajjaflfakhfakfbuyao极aigaolefuquqikangbuzhu2.3.4fu:ck:92:92:ff';
          const srcKey = ename + appKey + nwtime + ev;
          return CryptoJS.MD5(srcKey).toString();
        }
        
        // 从ename中提取ID
        function extractId(ename) {
          const match = ename.match(/\d+/);
          return match ? match[0] : '11342412';
        }
        
        // 检查URL是否已包含认证参数
        function hasAuthParams(url) {
          return url.includes('app=') && url.includes('sign=');
        }
        
        // 检查是否为需要添加认证参数的URL
        function needsAuthParams(url) {
          return url.startsWith('http://utuxx.91kds.cn/live1/');
        }
        
        // 检查是否为需要过滤的URL（kdsvod://协议）
        function shouldFilterUrl(url) {
          return url.startsWith('kdsvod://');
        }
        
        async function main() {
          console.log('开始生成简洁版直播源...');
          const startTime = Date.now();
          const currentTime = getBeijingTime();
          const ev = '20250113'; // 固定ev值
          
          let m3uContent = '#EXTM3U\n';
          
          // 添加更新时间频道（实际视频流）
          m3uContent += '#EXTINF:-1 tvg-id="UPDATE_TIME" tvg-name="更新时间: ' + currentTime + '" group-title="信息",更新时间: ' + currentTime + '\n';
          m3uContent += 'https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8\n\n';
          
          let totalChannels = 0;
          let totalStreams = 0;
          let streamsWithAuth = 0;
          let streamsWithoutAuth = 0;
          let filteredStreams = 0;
          
          // 完整分类列表
          const categories = [
            '央视', '卫视', '高清', '4K', '影视', '体育', '新闻', '财经', '综艺', '教育',
            '纪录', '国际', '网络', '购物', '虎牙', '安徽', '北京', '重庆', '福建',
            '甘肃', '湖北', '湖南', '吉林', '江苏', '江西', '辽宁', '内蒙古', '宁夏', '青海',
            '山东', '山西', '陕西', '上海', '贵州', '海南', '河北', '河南', '黑龙江', '天津',
            '新疆', '西藏', '云南', '极江', '广西', '广东', '四川'
          ];
          
          console.log('开始处理 ' + categories.length + ' 个分类...');
          
          for (const category of categories) {
            try {
              console.log('处理分类: ' + category);
              
              // 获取频道列表
              const response = await axios.get(
                'http://sj.91kds.cn/api/get_channel.php?id=' + encodeURIComponent(category),
                { 
                  timeout: 20000,
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    'Referer': '极://www.91kds.cn/'
                  }
                }
              );
              
              if (!response.data || !Array.isArray(response.data)) {
                console.log('分类 ' + category + ' 无数据，跳过');
                continue;
              }
              
              console.log('分类 ' + category极 ' 有 ' + response.data.length + ' 个频道');
              
              // 处理每个频道
              for (const channel of response.data) {
                try {
                  const nwtime = Math.floor(Date.now() / 1000);
                  const sign = generateSignature(channel.ename, nwtime, ev);
                  const id = extractId(channel.ename);
                  
                  let apiUrl;
                  if (category === '虎牙') {
                    apiUrl = 'http://api.91kds.cn/zone/srclist?ename=' + channel.ename;
                  } else {
                    apiUrl = 'http://sjapi1.91kds.cn/api/get_source.php?ename=' + channel.ename;
                  }
                  
                  console.log('处理频道: ' + channel.name + ', ev=' + ev);
                  
                  const sourceRes = await axios.get(apiUrl, { 
                    timeout: 20000,
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      'Referer': 'http://www.91kds.cn/'
                    }
                  });
                  
                  if (sourceRes.data && sourceRes.data.liveSource && Array.isArray(sourceRes.data.liveSource)) {
                    const sources = sourceRes.data.liveSource;
                    
                    // 添加频道信息
                    m3uContent += '#EXTINF:-1 tvg-id="' + channel.ename + '" tvg-name="' + channel.name + '" group-title="' + category + '",' + channel.name + '\n';
                    
                    for (const sourceUrl of sources) {
                      // 过滤掉kdsvod://协议的URL
                      if (shouldFilterUrl(sourceUrl)) {
                        console.log('过滤kdsvod协议URL: ' + sourceUrl);
                        filteredStreams++;
                        continue; // 跳过这个URL
                      }
                      
                      // 对于虎牙分类，确保URL以正确的格式开头
                      let finalUrl = sourceUrl;
                      if (category === '虎牙' && !sourceUrl.startsWith('http://utuxx.91kds.cn/live1/huya.m3u8?')) {
                        // 构建正确的虎牙播放源URL
                        finalUrl = 'http://utuxx.91kds.cn/live1/huya.m3u8?id=' + id;
                      }
                      
                      if (needsAuthParams(finalUrl) && !hasAuthParams(finalUrl)) {
                        // 如果是utuxx.91kds.cn/live1/域名且不包含认证参数，添加完整认证参数
                        const authParams = new URLSearchParams({
                          id: id,
                          app: 'com.jiaoxiang.fangnale',
                          version: '2.3.4',
                          mac: 'fu:ck:92:92:ff',
                          utk: '',
                          nwtime: nwtime.toString(),
                          ev: ev, // 固定ev值
                          sign: sign
                        }).toString();
                        
                        const separator = finalUrl.includes('?') ? '&' : '?';
                        const fullUrl = finalUrl + separator + authParams;
                        m3uContent += fullUrl + '\n';
                        streamsWithoutAuth++;
                        console.log('添加认证参数: ' + fullUrl.substring(0, 150));
                      } else {
                        // 直接使用原始URL（非utuxx.91kds.cn/live1/域名或已包含认证参数）
                        m3uContent += finalUrl + '\n';
                        streamsWithAuth++;
                        console.log('使用原始URL: ' + finalUrl.substring(0, 100));
                      }
                      totalStreams++;
                    }
                    
                    totalChannels++;
                  }
                  
                  await new Promise(resolve => setTimeout(resolve, 500));
                } catch (error) {
                  console.log('跳过频道: ' + channel.name);
                }
              }
              
              m3uContent += '\n';
              await new Promise(resolve => setTimeout(resolve, 1000));
            } catch (error) {
              console.log('跳过分类: ' + category);
            }
          }
          
          // 在文件末尾添加简洁的统计信息
          const duration = Math.round((Date.now() - startTime) / 1000);
          m3uContent += '# 统计: 分类=' + categories.length + ', 频道=' + totalChannels + ', 源=' + totalStreams + ', 耗时=' + duration + '秒\n';
          m3uContent += '# 更新时间: ' + currentTime + '\n';
          
          fs.writeFileSync('91ktv.m3u', m3uContent);
          
          console.log('生成完成!');
          console.log('分类数: ' + categories.length);
          console.log('频道数: ' + totalChannels);
          console.log('播放源数: ' + totalStreams);
          console.log('过滤URL数: ' + filteredStreams);
          console.log('已有认证参数: ' + streamsWithAuth);
          console.log('添加认证参数: ' + streamsWithoutAuth);
          console.log('ev参数: ' + ev);
          console.log('耗时: ' + duration + '秒');
        }
        
        main().catch(console.error);
        EOF
        
        echo "开始生成简洁版直播源..."
        node generate_clean.js

    - name: 验证简洁输出
      run: |
        echo "=== 简洁输出验证 ==="
        if [ -f 91ktv.m3u ]; then
          echo "文件大小: $(wc -c < 91ktv.m3u) 字节"
          echo "文件行数: $(wc -l < 91ktv.m3u)"
          echo ""
          echo "=== 头部内容 ==="
          head -5 91ktv.m3u
          echo ""
          echo "=== 尾部内容 ==="
          tail -3 91ktv.m3u
          echo ""
          echo "=== 虎牙分类验证 ==="
          echo "虎牙分类频道数: $(grep -c 'group-title=\"虎牙\"' 91ktv.m3u)"
          echo "虎牙分类URL格式: $(grep -A1 'group-title=\"虎牙\"' 91ktv.m3u | grep 'http://utuxx.91kds.cn/live1/huya.m3u8?' | head -1 | cut -d'?' -f1)"
        else
          echo "文件未生成"
        fi

    - name: 提交更新
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add 91ktv.m3u
        git commit -m "简洁版直播源更新 $(date +'%Y-%m-%d %H:%M')" || echo "无变化"
        git push
