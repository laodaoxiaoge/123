name: 🔄 代理检测（语法修复版）

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  proxy-check:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: ⚙️ 设置PHP环境
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer

    - name: 🔍 语法检查
      run: |
        # 检查PHP语法
        php -l scripts/proxy-checker.php
        echo "✅ PHP语法检查通过"

    - name: 🚀 运行修复后的脚本
      run: |
        cd scripts
        php proxy-checker.php

    - name: 💾 保存结果
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: proxy-results
        path: |
          proxy-result-*.txt
